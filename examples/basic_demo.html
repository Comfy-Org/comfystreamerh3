<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ComfyStreamerH3</title>
  <style>
    :root { color-scheme: dark; font: 14px system-ui, sans-serif; background: #090b0f; color: #f3f4f2; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(calc(100% - 32px), 1100px); margin: 0 auto; padding: 24px 0; }
    header { margin-bottom: 12px; color: #aab0ba; font-size: 11px; letter-spacing: .12em; }
    h1 { margin: 4px 0 0; color: #f3f4f2; font-size: 24px; letter-spacing: -.03em; }
    video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #000; border: 1px solid #2d3138; object-fit: contain; }
    form { margin-top: 12px; padding: 12px; border: 1px solid #2d3138; background: #0d1014; }
    label { display: block; margin-bottom: 7px; color: #b0b6c0; font-size: 11px; }
    .prompt-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(155px, auto) auto; align-items: end; gap: 10px; }
    textarea, select, button { min-height: 56px; padding: 10px; color: #f3f4f2; background: #090b0f; border: 1px solid #343941; border-radius: 3px; font: inherit; }
    textarea { width: 100%; resize: vertical; font-size: 12px; line-height: 1.45; }
    select { font-size: 12px; }
    .resolution-control { display: grid; gap: 6px; margin: 0; }
    .resolution-options { display: flex; align-items: center; gap: 8px; }
    .resolution-picker { display: flex; align-items: center; min-height: 56px; padding: 0 10px; background: #090b0f; border: 1px solid #343941; border-radius: 3px; }
    .resolution-picker select { min-height: 54px; padding: 10px 4px 10px 0; border: 0; }
    #gpu-label { color: #b0b6c0; font-size: 12px; white-space: nowrap; }
    #status { color: #9298a1; font-size: 10px; white-space: nowrap; }
    button { cursor: pointer; }
    button:disabled { cursor: wait; opacity: .65; }
    #status { display: block; min-height: 14px; margin-top: 8px; }
    @media (max-width: 640px) {
      main { width: calc(100% - 16px); padding: 10px 0; }
      .prompt-row { grid-template-columns: 1fr; }
      textarea, select, button { min-height: 42px; }
      .prompt-row button { justify-self: start; }
    }
  </style>
  <script>window.COMFYSTREAMERH3_DEMO_CONFIG = __DEMO_CONFIG__;</script>
</head>
<body>
  <main>
    <header>COMFYSTREAMERH3<h1>Text to video</h1></header>
    <video id="video" controls playsinline></video>
    <form id="prompt-form">
      <label for="prompt">Prompt</label>
      <div class="prompt-row">
        <textarea id="prompt" rows="2" maxlength="32000" required>Will Smith eating spaghetti.</textarea>
        <label class="resolution-control" for="resolution">Resolution
          <span class="resolution-options">
            <span class="resolution-picker">
              <select id="resolution">
                <option value="448x256" selected>448 × 256</option>
                <option value="512x320">512 × 320</option>
              </select>
              <span id="gpu-label">(RTX 5090)</span>
            </span>
          </span>
        </label>
        <button id="submit" type="submit">Run prompt</button>
      </div>
      <small id="status" role="status">Ready</small>
    </form>
  </main>
  <script>
    const form = document.querySelector('#prompt-form');
    const promptInput = document.querySelector('#prompt');
    const resolution = document.querySelector('#resolution');
    const gpuLabel = document.querySelector('#gpu-label');
    const submit = document.querySelector('#submit');
    const status = document.querySelector('#status');
    const video = document.querySelector('#video');
    const gpuForResolution = {'448x256': 'RTX 5090', '512x320': 'RTX 6000 Pro'};
    const demoConfig = window.COMFYSTREAMERH3_DEMO_CONFIG || {};
    const availableResolutions = new Set(demoConfig.availableResolutions || ['448x256', '512x320']);
    for (const option of resolution.options) {
      if (!availableResolutions.has(option.value)) {
        option.disabled = true;
        option.textContent += ' (not running)';
      }
    }
    resolution.value = demoConfig.defaultResolution || '448x256';
    if (demoConfig.platformMode) {
      status.textContent = 'Using a ready GPU found by Comfy CLI';
    }

    const updateGpuLabel = () => {
      gpuLabel.textContent = `(${gpuForResolution[resolution.value]})`;
    };
    resolution.addEventListener('change', updateGpuLabel);
    updateGpuLabel();

    async function readJson(response) {
      const value = await response.json();
      if (!response.ok) {
        const detail = typeof value.error === 'string' ? value.error : value.error?.message;
        throw new Error(detail || `Request failed (${response.status})`);
      }
      return value;
    }

    async function waitForVideo(promptId) {
      for (;;) {
        await new Promise(resolve => setTimeout(resolve, 2000));
        const history = await readJson(await fetch(`/api/history/${encodeURIComponent(promptId)}`));
        const run = history[promptId];
        if (!run) continue;
        const outputs = run.outputs || {};
        const output = outputs['12'];
        const videos = output?.videos || output?.images || [];
        const item = videos.find(file => /\.mp4$/i.test(file.filename || ''));
        if (item) {
          const query = new URLSearchParams({filename: item.filename, subfolder: item.subfolder || '', type: item.type || 'output'});
          video.src = `/api/view?${query}`;
          await video.play().catch(() => {});
          status.textContent = 'Video ready';
          return;
        }
        const messages = run.status?.messages || [];
        if (run.status?.status_str === 'error' || messages.some(message => message[0] === 'execution_error')) {
          throw new Error('ComfyUI could not complete this prompt. Check its console for details.');
        }
        if (run.status?.completed || run.status?.status_str === 'success') {
          throw new Error('Generation completed, but the workflow returned no MP4 video.');
        }
      }
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      const prompt = promptInput.value.trim();
      if (!prompt) { status.textContent = 'Enter a prompt first.'; return; }
      submit.disabled = true;
      video.removeAttribute('src');
      video.load();
      status.textContent = 'Submitting prompt…';
      try {
        const result = await readJson(await fetch('/api/prompt', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({prompt, resolution: resolution.value}),
        }));
        if (!result.prompt_id) throw new Error(result.error?.message || 'ComfyUI returned no prompt id.');
        status.textContent = 'Generating video…';
        await waitForVideo(result.prompt_id);
      } catch (error) {
        status.textContent = error instanceof Error ? error.message : 'Generation failed';
      } finally {
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
